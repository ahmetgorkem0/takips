<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Başvuru Kanalları — Takip Merkezi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand">Takip Merkezi</a>
  <div class="topnav-links">
    <a href="kanallar.html" class="active">Başvuru Kanalları</a>
    <a href="cvler.html">CV'ler</a>
    <a href="basvurular.html">Başvurulan İşler</a>
    <a href="fikirler.html">İş Kurma Fikirleri</a>
    <a href="hobiler.html">Hobiler</a>
  </div>
</nav>

<div class="page-head">
  <h1>Başvuru Kanalları</h1>
  <p>Başvuru yaptığın ya da takip ettiğin platformlar.</p>
</div>
<div id="syncBanner" class="sync-banner"></div>

<main class="container">
  <div id="kanallarList" class="channel-list"></div>
  <form id="kanalForm" class="inline-form">
    <input type="text" id="kanalAd" placeholder="Kanal adı (ör. LinkedIn)" required>
    <input type="url" id="kanalUrl" placeholder="https://... (opsiyonel)">
    <button type="submit" class="btn btn-add">+ Ekle</button>
  </form>
</main>

<footer class="footer">
  <span id="saveStatus">Hazır</span>
</footer>

<template id="tpl-channel">
  <div class="row-card channel-card">
    <div class="row-main">
      <a class="row-title link" target="_blank" rel="noopener"></a>
      <span class="row-title plain"></span>
    </div>
    <button class="icon-btn del-btn" title="Sil">✕</button>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
